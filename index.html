<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-container: #ffffff;
            --bg-header: #ffffff;
            --bg-quarter: #f9fafb;
            --bg-task: #ffffff;
            --border-main: #e5e7eb;
            --border-input: #e5e7eb;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-hover: rgba(59, 130, 246, 0.15);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-container: #1e293b;
            --bg-header: #1e293b;
            --bg-quarter: #334155;
            --bg-task: #1e293b;
            --border-main: #334155;
            --border-input: #475569;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(59, 130, 246, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            padding: 2rem;
            transition: background 0.3s;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 24px;
            box-shadow: 0 4px 20px var(--shadow);
            overflow: hidden;
            transition: all 0.3s;
        }

        .header {
            padding: 2rem;
            background: var(--bg-header);
            border-bottom: 2px solid var(--border-main);
            transition: all 0.3s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 900;
            font-family: 'Lato', sans-serif;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            transition: color 0.3s;
        }

        .header-title-group {
            display: flex;
            align-items: baseline;
            gap: 1.25rem;
        }

        .today-date {
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 36px;
            width: auto;
            object-fit: contain;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .logo-img:hover {
            opacity: 1;
        }

        .theme-toggle {
            background: var(--bg-quarter);
            border: 1.5px solid var(--border-input);
            border-radius: 8px;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: 'Lato', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .add-task-section {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            flex: 1;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border: 2px solid var(--border-input);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Lato', sans-serif;
            background: var(--bg-task);
            transition: all 0.3s;
            color: var(--text-primary);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input[type="date"] {
            padding: 0.875rem 1.25rem;
            border: 2px solid var(--border-input);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--bg-task);
            font-family: 'Lato', sans-serif;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .tag-picker-wrapper {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .tag-option {
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            opacity: 0.55;
        }

        .tag-option:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .tag-option.selected {
            opacity: 1;
            border-color: rgba(0,0,0,0.2);
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .btn-add {
            padding: 0.875rem 2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .timeline-container {
            padding: 3rem 2rem;
            overflow-x: auto;
        }

        .timeline-wrapper {
            min-width: 1200px;
            position: relative;
        }

        .timeline-axis {
            position: relative;
            height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-hover) 100%);
            border-radius: 2px;
            margin: 4rem 0 3rem 0;
        }

        .quarters {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin-bottom: 2rem;
        }

        .quarter-label {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            position: relative;
            transition: color 0.3s;
        }

        .quarter-label::after {
            content: '';
            position: absolute;
            bottom: -2.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: var(--bg-container);
            border: 4px solid var(--accent);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .quarter-label.current-quarter::after {
            width: 20px;
            height: 20px;
            background: #ef4444;
            border: 4px solid white;
            box-shadow: 0 0 0 2px #ef4444, 0 4px 12px rgba(239, 68, 68, 0.6);
            animation: pulse-quarter 2s ease-in-out infinite;
        }

        @keyframes pulse-quarter {
            0%, 100% {
                box-shadow: 0 0 0 2px #ef4444, 0 4px 12px rgba(239, 68, 68, 0.6);
            }
            50% {
                box-shadow: 0 0 0 2px #ef4444, 0 4px 20px rgba(239, 68, 68, 0.9);
            }
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            margin-top: 3rem;
        }

        .quarter-tasks {
            background: var(--bg-quarter);
            border-radius: 16px;
            padding: 1.5rem;
            min-height: 300px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .quarter-tasks.drag-over {
            border-color: var(--accent);
            background: var(--bg-task);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-item {
            background: var(--bg-task);
            border-radius: 12px;
            padding: 1.25rem 1.25rem 1.25rem 1rem;
            border-top: 2px solid var(--border-main);
            border-right: 2px solid var(--border-main);
            border-bottom: 2px solid var(--border-main);
            border-left: 5px solid var(--tag-color, var(--border-main));
            transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s, transform 0.15s;
            cursor: default;
            position: relative;
            user-select: none;
        }

        .task-item:hover {
            border-top-color: var(--border-main);
            border-right-color: var(--border-main);
            border-bottom-color: var(--border-main);
            border-left-color: var(--tag-color, var(--accent));
            box-shadow: 0 4px 12px var(--shadow-hover);
        }

        .task-item.is-dragging-source {
            opacity: 0.25;
            transform: scale(0.98);
        }

        .task-item.drop-above {
            border-top: 2.5px solid var(--accent);
            margin-top: -1px;
        }

        .task-item.drop-below {
            border-bottom: 2.5px solid var(--accent);
            margin-bottom: -1px;
        }

        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.92;
            box-shadow: 0 12px 32px rgba(0,0,0,0.18);
            border-radius: 12px;
            background: var(--bg-task);
            border: 2px solid var(--accent);
            transform: rotate(1.5deg) scale(1.03);
            transition: none;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.editing {
            border-color: var(--accent);
            cursor: default;
        }

        .task-item.expanded {
            border-color: var(--accent);
        }

        .task-notes {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-main);
            margin-left: 1.75rem;
        }

        .task-notes-textarea {
            width: 100%;
            min-height: 80px;
            padding: 0.75rem;
            border: 2px solid var(--border-input);
            border-radius: 8px;
            background: var(--bg-quarter);
            color: var(--text-primary);
            font-family: 'Lato', sans-serif;
            font-size: 0.875rem;
            resize: vertical;
            transition: all 0.3s;
        }

        .task-notes-textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-task);
        }

        .task-notes-display {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
            white-space: pre-wrap;
            cursor: text;
            padding: 0.5rem;
            background: var(--bg-quarter);
            border-radius: 6px;
        }

        .task-notes-placeholder {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-style: italic;
            cursor: pointer;
        }

        .task-notes-placeholder:hover {
            color: var(--text-secondary);
        }

        .task-date-input {
            padding: 0.25rem 0.5rem;
            border: 2px solid var(--accent);
            border-radius: 6px;
            background: var(--bg-task);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: 'Lato', sans-serif;
        }

        .task-date-input:focus {
            outline: none;
        }

        .task-date.editing-date {
            cursor: pointer;
        }

        .drag-handle {
            position: absolute;
            left: 0.35rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            cursor: grab;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 6px 3px;
            line-height: 1;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .task-item:hover .drag-handle {
            opacity: 0.7;
        }

        .task-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0;
            margin-left: 1.75rem;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-input);
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            margin-top: 1px;
        }

        .checkbox:hover {
            border-color: var(--accent);
        }

        .checkbox.checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
            transition: all 0.3s;
            margin-bottom: 0.6rem;
        }

        .task-title-input {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid var(--accent);
            border-radius: 6px;
            background: var(--bg-task);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Lato', sans-serif;
        }

        .task-title-input:focus {
            outline: none;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-meta {
            display: flex;
            gap: 0.75rem;
            margin-top: 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .task-tag-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.15rem 0.55rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.85;
            letter-spacing: 0.02em;
        }

        .task-tag-badge:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .tag-picker-popup {
            position: fixed;
            background: var(--bg-task);
            border: 2px solid var(--border-main);
            border-radius: 14px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            box-shadow: 0 8px 24px var(--shadow);
            z-index: 1000;
            animation: popupAppear 0.2s ease-out;
            min-width: 140px;
        }

        .tag-picker-popup .tag-popup-option {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s;
            opacity: 0.75;
            text-align: center;
        }

        .tag-picker-popup .tag-popup-option:hover {
            opacity: 1;
            transform: scale(1.03);
        }

        @keyframes popupAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .task-date, .task-days-left {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.3s;
        }

        .task-days-left {
            font-weight: 600;
        }

        .task-days-left.overdue {
            color: #ef4444;
        }

        .task-days-left.urgent {
            color: #f59e0b;
        }

        .task-days-left.soon {
            color: #f59e0b;
        }

        .task-days-left.normal {
            color: #10b981;
        }

        .task-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .task-item:hover .task-actions {
            opacity: 1;
        }

        .task-action-btn {
            background: var(--bg-quarter);
            border: 1px solid var(--border-main);
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .task-action-btn:hover {
            transform: scale(1.1);
        }

        .edit-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .delete-btn:hover {
            color: #ef4444;
            border-color: #ef4444;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 0.875rem;
        }

        @media (max-width: 1200px) {
            .tasks-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .add-task-section {
                flex-direction: column;
            }

            .input-group {
                flex-direction: column;
                width: 100%;
            }

            .color-picker-wrapper {
                justify-content: center;
            }

            .btn-add {
                width: 100%;
            }

            .tasks-grid {
                grid-template-columns: 1fr;
            }

            .timeline-container {
                overflow-x: scroll;
            }
        }

        .timeline-container::-webkit-scrollbar {
            height: 8px;
        }

        .timeline-container::-webkit-scrollbar-track {
            background: var(--bg-quarter);
            border-radius: 4px;
        }

        .timeline-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        .timeline-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="header-title-group">
                    <h1>Roadmap 2026</h1>
                    <span class="today-date" id="todayDate"></span>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" onclick="toggleTheme()">
                        <span id="themeIcon">Dark</span>
                    </button>
                </div>
            </div>
            <div class="add-task-section">
                <div class="input-group">
                    <input type="text" id="taskTitle" placeholder="Enter task name here">
                    <input type="date" id="taskDate" min="2026-01-01" max="2026-12-31">
                </div>
                <div class="tag-picker-wrapper">
                    <div class="tag-option selected" data-tag="Milestone" style="background:#6366f1;color:white;" onclick="selectTag('Milestone')">Milestone</div>
                    <div class="tag-option" data-tag="Development" style="background:#0ea5e9;color:white;" onclick="selectTag('Development')">Development</div>
                    <div class="tag-option" data-tag="Launch" style="background:#10b981;color:white;" onclick="selectTag('Launch')">Launch</div>
                    <div class="tag-option" data-tag="Decision" style="background:#f59e0b;color:white;" onclick="selectTag('Decision')">Decision</div>
                    <div class="tag-option" data-tag="Other" style="background:#8b5cf6;color:white;" onclick="selectTag('Other')">Other</div>
                </div>
                <button class="btn-add" onclick="addTask()">ADD</button>
            </div>
        </div>

        <div class="timeline-container">
            <div class="timeline-wrapper">
                <div class="quarters">
                    <div class="quarter-label">Q1</div>
                    <div class="quarter-label">Q2</div>
                    <div class="quarter-label">Q3</div>
                    <div class="quarter-label">Q4</div>
                </div>

                <div class="timeline-axis"></div>

                <div class="tasks-grid" id="tasksGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const quarters = [
            { name: 'Q1', months: [1, 2, 3] },
            { name: 'Q2', months: [4, 5, 6] },
            { name: 'Q3', months: [7, 8, 9] },
            { name: 'Q4', months: [10, 11, 12] }
        ];

        let tasks = JSON.parse(localStorage.getItem('roadmap2026_horizontal')) || [];
        let selectedTag = 'Milestone';
        let editingTaskId = null;
        let tagPickerTaskId = null;
        let expandedTaskId = null;
        let editingDateTaskId = null;

        // Migrate: assign order values to tasks that don't have them yet
        (function migrateOrder() {
            function _getQ(date) {
                const month = new Date(date).getMonth() + 1;
                return [1,2,3].includes(month) ? 0 : [4,5,6].includes(month) ? 1 : [7,8,9].includes(month) ? 2 : 3;
            }
            const byQuarter = [[], [], [], []];
            tasks.forEach(t => {
                const q = _getQ(t.date);
                byQuarter[q].push(t);
            });
            byQuarter.forEach(qTasks => {
                qTasks.sort((a, b) => new Date(a.date) - new Date(b.date));
                qTasks.forEach((t, i) => {
                    if (t.order === undefined || t.order === null) t.order = i;
                });
            });
        })();

        const availableTags = [
            { name: 'Milestone',   bg: '#6366f1', color: 'white' },
            { name: 'Development', bg: '#0ea5e9', color: 'white' },
            { name: 'Launch',      bg: '#10b981', color: 'white' },
            { name: 'Decision',    bg: '#f59e0b', color: 'white' },
            { name: 'Other',       bg: '#8b5cf6', color: 'white' },
        ];

        function getTagStyle(tagName) {
            return availableTags.find(t => t.name === tagName) || availableTags[availableTags.length - 1];
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').textContent = newTheme === 'dark' ? 'Light' : 'Dark';
            localStorage.setItem('theme', newTheme);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';
        }

        function selectTag(tag) {
            selectedTag = tag;
            document.querySelectorAll('.tag-option').forEach(opt => {
                opt.classList.toggle('selected', opt.getAttribute('data-tag') === tag);
            });
        }

        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const date = document.getElementById('taskDate').value;

            if (!title || !date) {
                alert('Please fill in all fields');
                return;
            }

            // Assign order = max existing order + 1 (within same quarter)
            const quarter = getQuarter(date);
            const sameQTasks = tasks.filter(t => getQuarter(t.date) === quarter);
            const maxOrder = sameQTasks.length > 0 ? Math.max(...sameQTasks.map(t => t.order ?? 0)) : -1;

            tasks.push({
                id: Date.now(),
                title,
                date,
                tag: selectedTag,
                completed: false,
                notes: '',
                order: maxOrder + 1
            });

            saveTasks();
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDate').value = '';
            renderTasks();
        }

        function toggleTask(id, event) {
            event.stopPropagation();
            if (editingTaskId === id) return;
            
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function startEdit(id, event) {
            event.stopPropagation();
            editingTaskId = id;
            renderTasks();
            
            setTimeout(() => {
                const input = document.getElementById(`edit-input-${id}`);
                if (input) {
                    input.focus();
                    input.select();
                }
            }, 0);
        }

        function saveEdit(id) {
            const input = document.getElementById(`edit-input-${id}`);
            const task = tasks.find(t => t.id === id);
            
            if (task && input) {
                const newTitle = input.value.trim();
                if (newTitle) {
                    task.title = newTitle;
                    saveTasks();
                }
            }
            
            editingTaskId = null;
            renderTasks();
        }

        function cancelEdit() {
            editingTaskId = null;
            renderTasks();
        }

        function deleteTask(id, event) {
            event.stopPropagation();
            if (confirm('Delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            }
        }

        function toggleTaskExpansion(id, event) {
            // Don't toggle if clicking on interactive elements
            if (event.target.closest('.checkbox') || 
                event.target.closest('.task-action-btn') || 
                event.target.closest('.task-tag-badge') ||
                event.target.closest('.task-notes-textarea') ||
                event.target.closest('.task-date') ||
                editingTaskId === id ||
                editingDateTaskId === id) {
                return;
            }
            
            if (expandedTaskId === id) {
                expandedTaskId = null;
            } else {
                expandedTaskId = id;
            }
            renderTasks();
            
            // Focus textarea after render if expanded
            if (expandedTaskId === id) {
                setTimeout(() => {
                    const textarea = document.getElementById(`notes-${id}`);
                    if (textarea) {
                        textarea.focus();
                    }
                }, 0);
            }
        }

        function saveNotes(id) {
            const textarea = document.getElementById(`notes-${id}`);
            const task = tasks.find(t => t.id === id);
            
            if (task && textarea) {
                task.notes = textarea.value;
                saveTasks();
            }
        }

        function startEditDate(id, event) {
            event.stopPropagation();
            editingDateTaskId = id;
            renderTasks();
            
            setTimeout(() => {
                const input = document.getElementById(`date-input-${id}`);
                if (input) {
                    input.focus();
                }
            }, 0);
        }

        function saveDate(id) {
            const input = document.getElementById(`date-input-${id}`);
            const task = tasks.find(t => t.id === id);
            
            if (task && input && input.value) {
                task.date = input.value;
                saveTasks();
            }
            
            editingDateTaskId = null;
            renderTasks();
        }

        function cancelDateEdit() {
            editingDateTaskId = null;
            renderTasks();
        }

        function showTagPicker(taskId, event) {
            event.stopPropagation();
            closeTagPicker();
            
            tagPickerTaskId = taskId;
            
            const popup = document.createElement('div');
            popup.className = 'tag-picker-popup';
            popup.id = 'tagPickerPopup';
            
            availableTags.forEach(t => {
                const opt = document.createElement('div');
                opt.className = 'tag-popup-option';
                opt.style.background = t.bg;
                opt.style.color = t.color;
                opt.textContent = t.name;
                opt.onclick = (e) => {
                    e.stopPropagation();
                    changeTaskTag(taskId, t.name);
                };
                popup.appendChild(opt);
            });
            
            const rect = event.target.getBoundingClientRect();
            popup.style.left = rect.left + 'px';
            popup.style.top = (rect.bottom + 8) + 'px';
            
            document.body.appendChild(popup);
        }

        function closeTagPicker() {
            const popup = document.getElementById('tagPickerPopup');
            if (popup) popup.remove();
            tagPickerTaskId = null;
        }

        function changeTaskTag(taskId, newTag) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.tag = newTag;
                saveTasks();
                renderTasks();
            }
            closeTagPicker();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.tag-picker-popup') && !e.target.closest('.task-tag-badge')) {
                closeTagPicker();
            }
        });

        function saveTasks() {
            localStorage.setItem('roadmap2026_horizontal', JSON.stringify(tasks));
        }

        function getQuarter(date) {
            const month = new Date(date).getMonth() + 1;
            return quarters.findIndex(q => q.months.includes(month));
        }

        function getDaysLeft(date) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const targetDate = new Date(date);
            targetDate.setHours(0, 0, 0, 0);
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function getDaysLeftClass(days) {
            if (days < 0) return 'overdue';
            if (days <= 14) return 'urgent';
            if (days <= 45) return 'soon';
            return 'normal';
        }

        function formatDaysLeft(days) {
            if (days < 0) return `${Math.abs(days)} days overdue`;
            if (days === 0) return 'Today';
            if (days === 1) return '1 day left';
            return `${days} days left`;
        }

        // ── Smooth pointer-based drag & drop ─────────────────────────────
        let pointerDrag = null; // active drag state

        function initDragAndDrop() {
            document.querySelectorAll('.drag-handle').forEach(handle => {
                handle.addEventListener('pointerdown', onDragHandleDown);
            });
        }

        function onDragHandleDown(e) {
            e.preventDefault();
            e.stopPropagation();

            const taskItem = e.currentTarget.closest('.task-item');
            if (!taskItem) return;

            const taskId = parseInt(taskItem.dataset.taskId);
            const rect   = taskItem.getBoundingClientRect();

            // Build ghost
            const ghost = taskItem.cloneNode(true);
            ghost.classList.add('drag-ghost');
            ghost.style.width  = rect.width  + 'px';
            ghost.style.height = rect.height + 'px';
            ghost.style.left   = rect.left   + 'px';
            ghost.style.top    = rect.top    + 'px';
            document.body.appendChild(ghost);

            taskItem.classList.add('is-dragging-source');

            pointerDrag = {
                taskId,
                taskItem,
                ghost,
                offsetX: e.clientX - rect.left,
                offsetY: e.clientY - rect.top,
                currentIndicator: null,   // { el, position }
            };

            document.addEventListener('pointermove', onDragMove, { passive: false });
            document.addEventListener('pointerup',   onDragEnd);
            document.addEventListener('pointercancel', onDragEnd);
        }

        function onDragMove(e) {
            if (!pointerDrag) return;
            e.preventDefault();

            const { ghost, offsetX, offsetY } = pointerDrag;

            // Move ghost
            ghost.style.left = (e.clientX - offsetX) + 'px';
            ghost.style.top  = (e.clientY - offsetY) + 'px';

            // Clear previous indicators
            clearDropIndicators();

            // Find task we're hovering over
            ghost.style.display = 'none';
            const el = document.elementFromPoint(e.clientX, e.clientY);
            ghost.style.display = '';

            if (!el) return;

            const hoveredItem = el.closest('.task-item');
            if (!hoveredItem || hoveredItem === pointerDrag.taskItem) return;

            const hoveredRect = hoveredItem.getBoundingClientRect();
            const midY = hoveredRect.top + hoveredRect.height / 2;
            const position = e.clientY < midY ? 'above' : 'below';

            hoveredItem.classList.add(position === 'above' ? 'drop-above' : 'drop-below');
            pointerDrag.currentIndicator = { el: hoveredItem, position };
        }

        function onDragEnd(e) {
            if (!pointerDrag) return;

            document.removeEventListener('pointermove', onDragMove);
            document.removeEventListener('pointerup',   onDragEnd);
            document.removeEventListener('pointercancel', onDragEnd);

            const { taskId, taskItem, ghost, currentIndicator } = pointerDrag;
            pointerDrag = null;

            ghost.remove();
            taskItem.classList.remove('is-dragging-source');
            clearDropIndicators();

            if (!currentIndicator) return;

            const { el: targetEl, position } = currentIndicator;
            const targetId = parseInt(targetEl.dataset.taskId);

            if (targetId === taskId) return;

            // Reorder tasks array
            const draggedTask = tasks.find(t => t.id === taskId);
            const targetTask  = tasks.find(t => t.id === targetId);
            if (!draggedTask || !targetTask) return;

            // Check if crossing quarters — update date to middle of target quarter
            const targetQuarter = getQuarter(targetTask.date);
            const sourceQuarter = getQuarter(draggedTask.date);
            if (targetQuarter !== sourceQuarter) {
                const middleMonth = quarters[targetQuarter].months[1];
                draggedTask.date = new Date(2026, middleMonth - 1, 15).toISOString().split('T')[0];
            }

            // Remove dragged task from array
            const fromIdx = tasks.findIndex(t => t.id === taskId);
            tasks.splice(fromIdx, 1);

            // Insert at new position
            let toIdx = tasks.findIndex(t => t.id === targetId);
            if (position === 'below') toIdx += 1;
            tasks.splice(toIdx, 0, draggedTask);

            // Re-assign order values for all tasks in the target quarter
            const tq = getQuarter(draggedTask.date);
            let orderCounter = 0;
            tasks.forEach(t => {
                if (getQuarter(t.date) === tq) {
                    t.order = orderCounter++;
                }
            });
            // Also fix source quarter if different
            if (sourceQuarter !== tq) {
                let srcCounter = 0;
                tasks.forEach(t => {
                    if (getQuarter(t.date) === sourceQuarter) {
                        t.order = srcCounter++;
                    }
                });
            }

            saveTasks();
            renderTasks();
        }

        function clearDropIndicators() {
            document.querySelectorAll('.drop-above, .drop-below').forEach(el => {
                el.classList.remove('drop-above', 'drop-below');
            });
        }

        function renderTasks() {
            const tasksByQuarter = [[], [], [], []];
            
            tasks.forEach(task => {
                const quarter = getQuarter(task.date);
                if (quarter >= 0) {
                    tasksByQuarter[quarter].push(task);
                }
            });

            // Sort tasks within each quarter by 'order' field (drag order), then date as fallback
            tasksByQuarter.forEach(quarterTasks => {
                quarterTasks.sort((a, b) => {
                    const ao = a.order ?? 0;
                    const bo = b.order ?? 0;
                    if (ao !== bo) return ao - bo;
                    return new Date(a.date) - new Date(b.date);
                });
            });

            const grid = document.getElementById('tasksGrid');
            let html = '';

            quarters.forEach((quarter, qIndex) => {
                html += `<div class="quarter-tasks" data-quarter="${qIndex}">`;
                
                const quarterTasks = tasksByQuarter[qIndex];
                
                if (quarterTasks.length === 0) {
                    html += `
                        <div class="empty-state">
                            <div class="empty-state-icon">—</div>
                            <div class="empty-state-text">No tasks for ${quarter.name}</div>
                        </div>
                    `;
                } else {
                    html += '<div class="task-list">';
                    quarterTasks.forEach(task => {
                        const daysLeft = getDaysLeft(task.date);
                        const daysClass = getDaysLeftClass(daysLeft);
                        const taskDate = new Date(task.date);
                        const formattedDate = taskDate.toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric'
                        });
                        const isEditing = editingTaskId === task.id;
                        const isExpanded = expandedTaskId === task.id;
                        const isEditingDate = editingDateTaskId === task.id;

                        html += `
                            <div class="task-item ${task.completed ? 'completed' : ''} ${isEditing ? 'editing' : ''} ${isExpanded ? 'expanded' : ''}" 
                                data-task-id="${task.id}"
                                style="--tag-color: ${getTagStyle(task.tag || 'Other').bg}"
                                onclick="toggleTaskExpansion(${task.id}, event)">
                                <div class="drag-handle">⋮⋮</div>
                                <div class="task-actions">
                                    <button class="task-action-btn edit-btn" onclick="startEdit(${task.id}, event)">✎</button>
                                    <button class="task-action-btn delete-btn" onclick="deleteTask(${task.id}, event)">×</button>
                                </div>
                                <div class="task-header">
                                    <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id}, event)"></div>
                                    <div class="task-content">
                                        ${isEditing ? `
                                            <input 
                                                type="text" 
                                                id="edit-input-${task.id}"
                                                class="task-title-input" 
                                                value="${task.title}"
                                                onblur="saveEdit(${task.id})"
                                                onkeydown="if(event.key==='Enter') saveEdit(${task.id}); if(event.key==='Escape') cancelEdit();"
                                                onclick="event.stopPropagation()"
                                            >
                                        ` : `
                                            <div class="task-title">${task.title}</div>
                                        `}
                                        <div class="task-meta">
                                            ${(() => { const ts = getTagStyle(task.tag || 'Other'); return `<div class="task-tag-badge" style="background:${ts.bg};color:${ts.color}" onclick="showTagPicker(${task.id}, event)" title="Click to change tag">${ts.name}</div>`; })()}
                                            ${isEditingDate ? `
                                                <input 
                                                    type="date" 
                                                    id="date-input-${task.id}"
                                                    class="task-date-input"
                                                    value="${task.date}"
                                                    min="2026-01-01"
                                                    max="2026-12-31"
                                                    onblur="saveDate(${task.id})"
                                                    onkeydown="if(event.key==='Enter') saveDate(${task.id}); if(event.key==='Escape') cancelDateEdit();"
                                                    onclick="event.stopPropagation()"
                                                >
                                            ` : `
                                                <div class="task-date" onclick="startEditDate(${task.id}, event)" title="Click to edit date">${formattedDate}</div>
                                            `}
                                            <div class="task-days-left ${daysClass}">${formatDaysLeft(daysLeft)}</div>
                                        </div>
                                    </div>
                                </div>
                                ${isExpanded ? `
                                    <div class="task-notes">
                                        <textarea 
                                            id="notes-${task.id}"
                                            class="task-notes-textarea" 
                                            placeholder="Add notes or description..."
                                            onblur="saveNotes(${task.id})"
                                            onclick="event.stopPropagation()"
                                        >${task.notes || ''}</textarea>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                
                html += '</div>';
            });

            grid.innerHTML = html;
            initDragAndDrop();
            updateCurrentDateIndicator();
        }

        function updateCurrentDateIndicator() {
            // Remove current-quarter class from all quarters
            document.querySelectorAll('.quarter-label').forEach(el => {
                el.classList.remove('current-quarter');
            });

            const today = new Date();
            const currentYear = today.getFullYear();

            // Only show indicator if we're in 2026
            if (currentYear !== 2026) return;

            // Get current month and determine quarter
            const currentMonth = today.getMonth() + 1; // 1-12
            const currentQuarterIndex = quarters.findIndex(q => q.months.includes(currentMonth));

            if (currentQuarterIndex >= 0) {
                const quarterLabels = document.querySelectorAll('.quarter-label');
                if (quarterLabels[currentQuarterIndex]) {
                    quarterLabels[currentQuarterIndex].classList.add('current-quarter');
                }
            }
        }

        document.getElementById('taskTitle').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('taskDate').focus();
            }
        });

        document.getElementById('taskDate').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        const today = new Date();
        if (today.getFullYear() === 2026) {
            document.getElementById('taskDate').value = today.toISOString().split('T')[0];
        } else {
            document.getElementById('taskDate').value = '2026-01-01';
        }

        loadTheme();

        // Set today's date display
        (function() {
            const now = new Date();
            const formatted = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const el = document.getElementById('todayDate');
            if (el) el.textContent = formatted;
        })();

        renderTasks();
    </script>
</body>
</html>
